<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>DD Motors</title>
  <script>
    // SPA fallback: redirect path to index.html via query string
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      '/?/' +
      l.pathname.slice(1).replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
